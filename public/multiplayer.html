<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji Blaster — Multiplayer</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #191825; --panel: #232134; --amber: #FFB627; --teal: #00A896; --coral: #FF6B6B; --paper: #F4F1EA; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); font-family: 'Inter', sans-serif; }
  .wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
  h1 { font-family: 'Baloo 2', sans-serif; font-size: 32px; margin: 0 0 24px; }
  a.back { color: #8B87A3; font-size: 13px; text-decoration: none; margin-bottom: 20px; }

  /* Lobby */
  .panel { background: var(--panel); border-radius: 18px; padding: 28px; width: min(90vw, 400px); text-align: center; }
  .panel input { width: 100%; padding: 12px 14px; margin: 8px 0; border-radius: 10px; border: 2px solid #3A3752; background: var(--ink); color: var(--paper); font-size: 15px; }
  .panel input:focus { outline: none; border-color: var(--teal); }
  .panel button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: none; background: var(--amber); color: var(--ink); font-weight: 700; font-size: 15px; cursor: pointer; }
  .panel button.secondary { background: var(--teal); color: var(--ink); }
  .divider { margin: 18px 0; color: #6C6885; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; }
  .error { color: var(--coral); font-size: 13px; margin-top: 8px; min-height: 16px; }

  /* Game screen */
  .game-layout { display: none; width: 100%; max-width: 900px; gap: 20px; }
  .game-layout.active { display: flex; }
  .stage-col { flex: 1; }
  .room-code-tag { background: var(--panel); display: inline-block; padding: 6px 14px; border-radius: 8px; font-weight: 700; letter-spacing: 0.1em; color: var(--amber); margin-bottom: 12px; }
  .stage { position: relative; background: var(--panel); border-radius: 16px; height: 420px; overflow: hidden; margin-bottom: 16px; }
  .falling-emoji { position: absolute; font-size: 60px; top: -60px; left: 50%; transform: translateX(-50%); }
  .waiting-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #6C6885; font-weight: 600; text-align: center; padding: 20px; }
  .feed { position: absolute; top: 10px; left: 10px; right: 10px; font-size: 13px; font-weight: 700; color: var(--teal); text-align: center; min-height: 18px; }
  .guess-input { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #3A3752; background: var(--panel); color: var(--paper); font-size: 16px; }
  .guess-input:focus { outline: none; border-color: var(--amber); }
  .start-btn { width: 100%; margin-top: 10px; padding: 12px; border-radius: 10px; border: none; background: var(--coral); color: var(--ink); font-weight: 700; cursor: pointer; }

  .scoreboard { width: 220px; background: var(--panel); border-radius: 16px; padding: 18px; }
  .scoreboard h3 { font-family: 'Baloo 2', sans-serif; margin: 0 0 12px; font-size: 18px; }
  .score-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #3A3752; font-size: 14px; }
  .score-row:last-child { border-bottom: none; }
  .score-row .name { font-weight: 700; }
  .score-row .pts { color: var(--amber); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Back to menu</a>
  <h1>👥 Multiplayer</h1>

  <!-- LOBBY -->
  <div class="panel" id="lobby">
    <input type="text" id="username" placeholder="Your username" maxlength="16">
    <button id="createBtn">Create Room</button>
    <div class="divider">or</div>
    <input type="text" id="joinCode" placeholder="Room code" maxlength="6" style="text-transform:uppercase">
    <button class="secondary" id="joinBtn">Join Room</button>
    <div class="error" id="lobbyError"></div>
  </div>

  <!-- GAME -->
  <div class="game-layout" id="gameLayout">
    <div class="stage-col">
      <div class="room-code-tag" id="roomCodeTag"></div>
      <div class="stage" id="stage">
        <div class="feed" id="feed"></div>
        <div class="waiting-msg" id="waitingMsg">Waiting for players to be ready…</div>
      </div>
      <input type="text" class="guess-input" id="guessInput" placeholder="Type the keyword and hit Enter…" disabled>
      <button class="start-btn" id="startBtn">Start Game</button>
    </div>
    <div class="scoreboard">
      <h3>Scoreboard</h3>
      <div id="scoreList"></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let currentRoomCode = null;
  let fallTimer = null;

  const lobby = document.getElementById('lobby');
  const gameLayout = document.getElementById('gameLayout');
  const usernameInput = document.getElementById('username');
  const joinCodeInput = document.getElementById('joinCode');
  const lobbyError = document.getElementById('lobbyError');
  const roomCodeTag = document.getElementById('roomCodeTag');
  const stage = document.getElementById('stage');
  const waitingMsg = document.getElementById('waitingMsg');
  const feed = document.getElementById('feed');
  const guessInput = document.getElementById('guessInput');
  const startBtn = document.getElementById('startBtn');
  const scoreList = document.getElementById('scoreList');

  function enterGameScreen(code) {
    currentRoomCode = code;
    roomCodeTag.textContent = `ROOM ${code}`;
    lobby.style.display = 'none';
    gameLayout.classList.add('active');
  }

  document.getElementById('createBtn').addEventListener('click', () => {
    const username = usernameInput.value.trim();
    if (!username) { lobbyError.textContent = 'Enter a username first.'; return; }
    socket.emit('create-room', { username });
  });

  document.getElementById('joinBtn').addEventListener('click', () => {
    const username = usernameInput.value.trim();
    const code = joinCodeInput.value.trim().toUpperCase();
    if (!username) { lobbyError.textContent = 'Enter a username first.'; return; }
    if (!code) { lobbyError.textContent = 'Enter a room code.'; return; }
    socket.emit('join-room', { code, username });
  });

  socket.on('room-created', ({ code }) => enterGameScreen(code));
  socket.on('room-joined', ({ code }) => enterGameScreen(code));
  socket.on('join-error', ({ message }) => { lobbyError.textContent = message; });

  startBtn.addEventListener('click', () => {
    socket.emit('start-game');
    startBtn.style.display = 'none';
  });

  socket.on('game-started', () => {
    waitingMsg.style.display = 'none';
    guessInput.disabled = false;
    guessInput.focus();
  });

  socket.on('emoji-spawn', ({ emoji, fallDuration }) => {
    stage.querySelectorAll('.falling-emoji').forEach(el => el.remove());
    clearTimeout(fallTimer);
    const el = document.createElement('div');
    el.className = 'falling-emoji';
    el.textContent = emoji;
    el.style.transition = `top ${fallDuration}ms linear`;
    stage.appendChild(el);
    requestAnimationFrame(() => { el.style.top = (stage.clientHeight - 60) + 'px'; });
    guessInput.value = '';
    feed.textContent = '';
  });

  socket.on('emoji-correct', ({ username, emoji, guess }) => {
    feed.textContent = `${username} got it — "${guess}" ${emoji}`;
    stage.querySelectorAll('.falling-emoji').forEach(el => el.remove());
  });

  socket.on('emoji-miss', () => {
    feed.textContent = 'Missed! Next one incoming…';
    stage.querySelectorAll('.falling-emoji').forEach(el => el.remove());
  });

  socket.on('scoreboard', (players) => {
    scoreList.innerHTML = players.map(p =>
      `<div class="score-row"><span class="name">${p.username}</span><span class="pts">${p.score}</span></div>`
    ).join('');
  });

  guessInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && guessInput.value.trim()) {
      socket.emit('submit-guess', { guess: guessInput.value.trim() });
      guessInput.value = '';
    }
  });
</script>
</body>
</html>
