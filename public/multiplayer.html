<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji Blaster — Multiplayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- LANDING -->
  <section id="screen-landing" class="screen">
    <h1 class="display">Emoji Blaster</h1>
    <p class="subtitle">Multiplayer</p>

    <input id="username-input" type="text" placeholder="Your name" maxlength="16" autocomplete="off">

    <div class="button-row">
      <button id="create-room-btn" class="btn btn-primary">Create Room</button>
    </div>

    <div class="divider">or</div>

    <div class="button-row">
      <input id="join-code-input" type="text" placeholder="ROOM CODE" maxlength="5" autocomplete="off">
      <button id="join-room-btn" class="btn btn-secondary">Join</button>
    </div>

    <p id="landing-error" class="error hidden"></p>
  </section>

  <!-- LOBBY -->
  <section id="screen-lobby" class="screen hidden">
    <h1 class="display">Room</h1>
    <div id="room-code-display" class="room-code"></div>
    <p class="hint">Share this code so others can join</p>

    <ul id="player-list" class="player-list"></ul>

    <button id="ready-btn" class="btn btn-primary">Ready Up</button>
    <p class="hint">Game starts automatically once everyone is ready</p>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen hidden">
    <div id="game-hud">
      <div id="room-code-small"></div>
    </div>

    <div id="fall-zone">
      <div id="falling-emoji"></div>
      <div id="round-feedback"></div>
    </div>

    <input id="guess-input" type="text" placeholder="Type the keyword and press Enter…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <aside id="scoreboard">
      <h2>Scoreboard</h2>
      <ol id="scoreboard-list"></ol>
    </aside>
  </section>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
